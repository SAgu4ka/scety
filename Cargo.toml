[package]
name = "scety"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/SAgu4ka/scety"

[dependencies]
tokio = { version = "1", features = ["full", "signal"] }
tokio-util = "0.7"
tokio-rustls = { version = "0.26", optional = true }
tokio-rustls-acme = { version = "0.9", optional = true }
tokio-stream = { version = "0.1", features = ["net"], optional = true }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
chrono = { version = "0.4", optional = true }
walkdir = "2.5"
static-toml = "1.3"
httparse = { version = "1.10", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["chrono", "env-filter"] }
clap = { version = "4", features = ["derive"] }
nix = { version = "0.31", features = ["user", "fs"] }
humantime = "2.4"
smallvec = "1.15"
futures = { version = "0.3", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
rustls-pki-types = { version = "1", features = ["std"], optional = true }
lru = { version = "0.18", optional = true }
x509-parser = { version = "0.18", optional = true }
webpki-roots = { version = "1", optional = true }
const_format = "0.2"
socket2 = { version = "0.6", optional = true }
libc = { version = "0.2", optional = true }
fxhash = { version = "0.2", optional = true }
mio = { version = "1.2", features = ["net", "os-ext"], optional = true }
num_cpus = { version = "1.17", optional = true }
slab = { version = "0.4", optional = true }
quinn = { version = "0.11", optional = true }
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }
http = { version = "1", optional = true }
bytes = { version = "1", optional = true }

[features]
default = ["l4", "l7", "static"]
l4 = ["dep:socket2", "dep:libc", "dep:fxhash", "dep:mio", "dep:num_cpus", "dep:slab"]
l7 = ["dep:chrono", "dep:httparse", "dep:futures", "dep:tokio-rustls", "dep:tokio-rustls-acme", "dep:tokio-stream", "dep:rustls", "dep:rustls-pki-types", "dep:lru", "dep:x509-parser", "dep:webpki-roots"]
static = ["dep:quinn", "dep:h3", "dep:h3-quinn", "dep:http", "dep:bytes", "dep:tokio-rustls", "dep:tokio-rustls-acme", "dep:tokio-stream", "dep:futures", "dep:rustls", "dep:rustls-pki-types"]

[build-dependencies]
toml = "1.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"