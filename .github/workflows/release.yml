name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: scety

jobs:
  check-version:
    name: Verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare tag with package version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg_version="$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          echo "Tag version:    $tag"
          echo "Cargo.toml version: $pkg_version"
          if [ "$tag" != "$pkg_version" ]; then
            echo "::error::Tag v$tag does not match Cargo.toml version $pkg_version"
            exit 1
          fi

  test:
    name: Test
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-release-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --verbose

  build:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            asset_name: linux-amd64
          - target: aarch64-unknown-linux-musl
            asset_name: linux-arm64
          - target: armv7-unknown-linux-musleabihf
            asset_name: linux-armv7

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Build release binary
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Package artifact
        id: package
        run: |
          set -euo pipefail
          staging="${BIN_NAME}-${GITHUB_REF_NAME}-${{ matrix.asset_name }}"
          mkdir -p "dist/$staging"

          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "dist/$staging/"
          cp README.md LICENSE "dist/$staging/"
          [ -f CHANGELOG.md ] && cp CHANGELOG.md "dist/$staging/" || true

          cd dist
          tar -czf "${staging}.tar.gz" "$staging"
          sha256sum "${staging}.tar.gz" > "${staging}.tar.gz.sha256"
          rm -rf "$staging"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build combined checksums file
        run: |
          cd dist
          sha256sum -c ./*.sha256 --strict
          cat ./*.sha256 > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/SHA256SUMS.txt