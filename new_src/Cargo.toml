[package]
name = "scety-dev"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/SAgu4ka/scety"

[dependencies]

tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["chrono", "env-filter"] }
clap = { version = "4", features = ["derive"] }
toml = "1"
async-trait = "0.1"
walkdir = "2"
rayon = "1"
serde = { version = "1.0", features = ["derive"] }
regex = "1"
nix = { version = "0.31", features = ["process"] }

[build-dependencies]
toml = "1"
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.13", features = ["blocking"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
