[package]
name = "scety-dev"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/SAgu4ka/scety"

[features]
default = ["mstatic"]
mstatic = []

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tokio-rustls = { version = "0.26", optional = true }
tokio-rustls-acme = { version = "0.9", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["chrono", "env-filter"] }
clap = { version = "4", features = ["derive"] }
toml = "1"
async-trait = "0.1"
walkdir = "2"
rayon = "1"
serde = { version = "1.0", features = ["derive"] }
serde-inline-default = "1.0.2"
regex = "1"
nix = { version = "0.32", features = ["process", "user", "fs", "signal"] }
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
rustls-pki-types = { version = "1", features = ["std"], optional = true }

[build-dependencies]
toml = "1"
serde = { version = "1.0", features = ["derive"] }
# reqwest = { version = "0.13", features = ["blocking"] }
serde-inline-default = "1.0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
